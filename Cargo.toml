[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.4"
edition = "2024"
license = "GPL-3.0-only"
authors = ["prelude contributors"]
rust-version = "1.85"

[workspace.dependencies]
aes = "0.8.4"
anyhow = "1.0.100"
async-trait = "0.1.89"
bitflags = "2.10.0"
bytes = { version = "1.11.0", features = ["serde"] }
clap = { version = "4.5.53", features = ["derive", "env"] }
crc = "3.3.0"
ctr = "0.9.2"
fs2 = "0.4.3"
fontdue = "0.9.3"
hex = "0.4.3"
hkdf = "0.12.4"
i2cdev = "0.6.2"
libc = "0.2.177"
nix = { version = "0.30.1", features = ["fs", "ioctl", "net", "poll", "process", "signal", "socket", "time", "user"] }
p256 = { version = "0.13.2", features = ["ecdsa"] }
proptest = "1.9.0"
rusb = "0.9.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
smithay-client-toolkit = { version = "0.19.2", default-features = false }
subtle = "2.6.1"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.17", features = ["codec"] }
toml = "0.9.8"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.19.0", features = ["serde", "v4"] }
wayland-client = "0.31.10"
x509-cert = "0.2.5"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
unused_lifetimes = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "allow", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "symbols"
