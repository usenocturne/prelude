require conf/distro/superbird.conf

DISTRO = "prelude"
DISTRO_NAME = "Prelude"
DISTRO_VERSION = "1.0.4"
MAINTAINER = "Nocturne Team <hello@usenocturne.com>"

SUPERBIRD_HOSTNAME = "prelude"
SUPERBIRD_MDNS_SERVICE_NAME = "Prelude"
SUPERBIRD_USB_GADGET_NAME = "prelude"
SUPERBIRD_USB_GADGET_MANUFACTURER = "Vanta Labs"
SUPERBIRD_USB_GADGET_PRODUCT = "Prelude"
SUPERBIRD_DESCRIPTION = "Wired and wireless CarPlay/Android Auto receiver for Spotify Car Thing"

# Accept only FAAD2's restricted-policy flag. The recipe and library remain
# GPL-2.0-only; this does not opt the distro into unrelated commercial codecs.
LICENSE_FLAGS_ACCEPTED += "commercial_faad2"

# Every image supports wired and wireless projection: the onboard Bluetooth
# controller carries the wireless bootstrap and a USB Wi-Fi adapter hosts the
# access point, so the BSP's bluetooth and wifi features stay enabled.
DISTRO_FEATURES:remove = "x11 3g nfc vulkan pulseaudio multiarch nfs zeroconf debuginfod ptest"

# Gadget mode is a direct-USB development recovery facility. Product images
# remove its package; development images enable both halves for no-UART access.
SYSTEMD_AUTO_ENABLE:pn-superbird-usb-gadget = "enable"
SYSTEMD_AUTO_ENABLE:pn-android-tools-adbd = "enable"
